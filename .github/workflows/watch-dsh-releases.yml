# 宿主版本监控：每日对照 npm 上 @deepseek-ai/dsh 的发布与 dist-tags，
# 与 main 的当前兼容矩阵核对，发现漂移时自动开/更新 label=compat-drift 的 issue。
# 校验规则本身在 scripts/check-compat.mjs，本地可随时手跑。
name: watch-dsh-releases

on:
  schedule:
    - cron: "17 1 * * *" # 每日 09:17（Asia/Shanghai）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # main：当前兼容矩阵 + 校验脚本本体
      - uses: actions/checkout@v4
      # E-8：shallow clone 宿主 monorepo，校验 vendored clientBundle.ts 的
      # 平台种子是否镜像宿主 platform.ts（宿主种子扩张 = 插件 bundle externals 落后，
      # 运行时才炸——每日提前发现）。
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness
          depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: compat
        run: node scripts/check-compat.mjs --report drift-report.md
      - id: bundle-sync
        # 校验脚本退出非零（漂移或自身故障）→ 打 failed 标记给开 issue 步骤。
        # Actions 的 bash 带 -e，须用 || 捕获而非 echo $?（否则步骤直接中止）。
        # DSH_FETCH_HOST_TAG=1：宿主检出是 shallow clone（默认分支、无 tag），
        # 脚本据此补取「本仓声明的最新兼容版本」对应的 tag，让比对对着我们声称
        # 兼容的那一代宿主，而不是对着工作区/默认分支猜（后者会制造假警报）。
        env:
          DSH_FETCH_HOST_TAG: '1'
        run: node scripts/check-clientbundle-sync.mjs --repo harness || echo "failed=1" >> "$GITHUB_OUTPUT"
      - name: 平台种子漂移时开/更新 issue
        if: steps.bundle-sync.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create clientbundle-drift --description "vendored clientBundle 平台种子漂移" --color D93F0B --force
          existing=$(gh issue list --label clientbundle-drift --state open --json number --jq '.[0].number // empty')
          body="平台种子漂移，详见当日 Actions 日志的 bundle-sync 步骤输出（宿主/本仓两侧列表对比）。宿主 platform.ts 的 PLATFORM_MODULES 扩张后须镜像到 scripts/clientBundle.ts。"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "[自动] clientBundle 平台种子漂移：$(date -u +%F)" --label clientbundle-drift --body "$body"
          fi
      - name: 漂移时开/更新 issue
        # 仅在「校验脚本判定漂移」时开 issue；pnpm 安装等基础设施故障
        # （compat 步骤根本没跑，outcome 为 skipped）不触发，避免误报噪音。
        if: steps.compat.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create compat-drift --description "宿主版本与兼容矩阵漂移" --color B60205 --force
          existing=$(gh issue list --label compat-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift-report.md
          else
            gh issue create --title "[自动] 宿主版本漂移：$(date -u +%F)" --label compat-drift --body-file drift-report.md
          fi
