# CI：在 Node 22 与 24 上验证构建与全量测试
name: CI

on:
  push:
    branches: [main, compat/stable-dsh]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # tsdown 的 lib entry（lib/types/*.js）是 tsc 中间产物，.gitignore 不入库——
      # 干净 checkout 必须先跑 tsc，否则 bundle 报 UNRESOLVED_ENTRY。
      - run: pnpm run build
      - run: pnpm test
